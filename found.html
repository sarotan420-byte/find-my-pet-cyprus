<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Found pets in Cyprus — Find My Pet Cyprus</title>
<meta name="description" content="Browse found dogs, cats and other pets across Cyprus. Filter by species, colour, size, breed and area." />
<link rel="canonical" href="/found" />
<script src="./ds-base.js"></script>
<style>
:root { --edge: clamp(16px, 4vw, 48px); --white: #fff; }
body { margin: 0; background: var(--white); text-wrap: pretty; }
a { color: var(--color-accent-700); }
a:hover { color: var(--color-accent-800); }
.nav { padding-inline: max(var(--edge), calc((100% - 1320px) / 2 + var(--edge))); position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--color-neutral-200); }
.nav .links { display: flex; gap: var(--space-4); margin-right: auto; margin-left: var(--space-4); }
.nav .links a, .nav .actions > a:not(.btn) { color: var(--color-text); text-decoration: none; }
.nav .links a[aria-current] { color: var(--color-accent-700); font-weight: 600; }
.nav .actions { display: flex; align-items: center; gap: var(--space-3); }
@media (max-width: 720px) { .nav .links { display: none; } }

.wrap { max-width: 1320px; margin: 0 auto; padding: 0 var(--edge) calc(3 * var(--space-6)); }
.head { padding: var(--space-6) 0 var(--space-4); display: flex; align-items: end; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; }
.head h1 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(30px, 3.6vw, 44px); line-height: 1.1; margin: 0; }
.head p { font-size: 15px; line-height: 1.6; margin: 8px 0 0; max-width: 60ch; color: color-mix(in srgb, var(--color-text) 72%, transparent); }
.switch { display: flex; background: var(--color-neutral-100); border-radius: 999px; padding: 4px; }
.switch a { text-decoration: none; color: var(--color-text); padding: 9px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; }
.switch a[aria-current] { background: var(--white); box-shadow: var(--shadow-sm); }

.layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: var(--space-6); align-items: start; }

.filters { position: sticky; top: 80px; display: flex; flex-direction: column; gap: var(--space-4); max-height: calc(100vh - 100px); overflow-y: auto; padding: 2px 6px 2px 2px; }
.fgroup { display: flex; flex-direction: column; gap: 8px; }
.fgroup > .lbl { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 62%, transparent); }
.filters .input { background: var(--white); border-color: var(--color-neutral-300); }
.searchbox { position: relative; }
.searchbox .input { padding-left: 40px; }
.searchbox svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); opacity: .55; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt input { position: absolute; opacity: 0; width: 0; height: 0; }
.opt span { display: inline-block; padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--color-neutral-300); font-size: 13.5px; cursor: pointer; }
.opt span:hover { border-color: var(--color-accent); }
.opt input:checked + span { background: var(--color-text); border-color: var(--color-text); color: var(--white); }
.opt input:focus-visible + span { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.swatches { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.swatch { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; cursor: pointer; font-size: 13.5px; border: 1.5px solid transparent; }
.swatch:hover { background: var(--color-neutral-100); }
.swatch input { position: absolute; opacity: 0; width: 0; height: 0; }
.swatch i { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); flex: none; }
.swatch:has(input:checked) { border-color: var(--color-text); background: var(--color-neutral-100); font-weight: 600; }
.swatch:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: 1px; }
.check { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--color-accent); }
.filters-head { display: none; }

.main-top { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); margin-bottom: var(--space-3); flex-wrap: wrap; }
.count { font-family: var(--font-heading); font-size: 18px; }
.sortbox { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
.sortbox select { width: auto; background: var(--white); }
#toggle-filters { display: none; }
.active { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--space-3); }
.active:empty { display: none; }
.pill { all: unset; cursor: pointer; background: var(--color-accent-100); color: var(--color-accent-800); padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.pill:hover { background: var(--color-accent-200); }
.clear-all { all: unset; cursor: pointer; font-size: 13px; text-decoration: underline; padding: 6px 8px; }

.results { display: flex; flex-direction: column; gap: var(--space-3); }
.row { display: grid; grid-template-columns: 200px minmax(0,1fr); gap: var(--space-4); text-decoration: none; color: inherit; padding: var(--space-3); border-radius: calc(1.25 * var(--radius-lg)); border: 1px solid var(--color-neutral-200); transition: box-shadow .15s, border-color .15s; }
.row:hover { color: inherit; border-color: transparent; box-shadow: var(--shadow-md); }
.row .ph { border-radius: var(--radius-lg); overflow: hidden; aspect-ratio: 1; background: var(--color-surface); }
.row .ph img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.8) contrast(.95); }
.row .body { display: flex; flex-direction: column; gap: 8px; min-width: 0; padding: 4px 0; }
.row .top { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); flex-wrap: wrap; }
.row .nm { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 22px; margin: 0; }
.row .date { font-size: 13px; font-weight: 600; color: var(--color-accent-2-700); }
.traits { display: flex; flex-wrap: wrap; gap: 6px; }
.traits span { font-size: 13px; background: var(--color-neutral-100); padding: 4px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; }
.traits .cols i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }
.traits .cols i:last-of-type { margin-right: 3px; }
.desc { font-size: 14.5px; line-height: 1.55; margin: 0; color: color-mix(in srgb, var(--color-text) 78%, transparent); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: auto; }
.loc { font-size: 13.5px; font-weight: 600; margin-right: auto; }
.empty { text-align: center; padding: calc(2 * var(--space-6)) var(--space-4); border: 1.5px dashed var(--color-neutral-300); border-radius: calc(1.5 * var(--radius-lg)); }
.empty h3 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 22px; margin: 0 0 6px; }
.empty p { font-size: 14.5px; margin: 0 auto var(--space-4); max-width: 44ch; color: color-mix(in srgb, var(--color-text) 70%, transparent); }

@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  #toggle-filters { display: inline-flex; }
  .filters { display: none; position: fixed; inset: 0; z-index: 100; top: 0; max-height: none; background: var(--white); padding: var(--space-4); }
  body.filters-open .filters { display: flex; }
  body.filters-open { overflow: hidden; }
  .filters-head { display: flex; justify-content: space-between; align-items: center; }
  .filters-head b { font-family: var(--font-heading); font-weight: 400; font-size: 22px; }
  .filters .done { position: sticky; bottom: 0; margin-top: auto; }
}
@media (min-width: 901px) { .filters .done { display: none; } }
@media (max-width: 560px) {
  .row { grid-template-columns: 110px minmax(0,1fr); gap: var(--space-3); padding: 10px; }
  .row .nm { font-size: 18px; }
  .desc { display: none; }
}
</style>
</head>
<body data-status="found">
<nav class="nav">
  <a class="nav-brand" href="index.html" style="text-decoration:none;color:inherit">Find My Pet Cyprus</a>
  <span class="links">
    <a href="missing.html">Missing pets</a>
    <a href="found.html" aria-current="page">Found pets</a>
    <a href="adopt.html">Adopt</a>
    <a href="index.html">Map</a>
  </span>
  <span class="actions">
    <a href="account.html">Sign in</a>
    <a href="submit.html" class="btn btn-primary">Report a pet</a>
  </span>
</nav>

<div class="wrap">
  <header class="head">
    <div>
      <h1>Found pets in Cyprus</h1>
      <p>Pets found and kept safe by members of the public. If one looks like yours, open the listing to get in touch.</p>
    </div>
    <div class="switch" role="tablist" aria-label="Listing type">
      <a href="missing.html">Missing</a>
      <a href="found.html" aria-current="page">Found</a>
    </div>
  </header>

  <div class="layout">
    <form class="filters" id="filters" aria-label="Filter listings">
      <div class="filters-head"><b>Filters</b><button type="button" class="btn btn-ghost" id="close-filters">Close</button></div>

      <div class="fgroup">
        <label class="lbl" for="q">Keywords</label>
        <div class="searchbox">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input class="input" id="q" type="search" placeholder="Breed, name, red collar…" />
        </div>
      </div>

      <div class="fgroup">
        <label class="lbl" for="species">Animal</label>
        <select class="input" id="species">
          <option value="">Any animal</option>
          <option value="Dog">Dog</option>
          <option value="Cat">Cat</option>
          <option value="Other">Other / exotic (birds, rabbits, reptiles…)</option>
        </select>
      </div>

      <div class="fgroup" id="colour-group">
        <span class="lbl">Colour <span style="text-transform:none;letter-spacing:0;font-weight:400">· cats &amp; dogs, pick all that apply</span></span>
        <div class="swatches" id="colours"></div>
      </div>

      <div class="fgroup">
        <span class="lbl">Size</span>
        <div class="opts" id="sizes">
          <label class="opt"><input type="checkbox" value="Small"><span>Small</span></label>
          <label class="opt"><input type="checkbox" value="Medium"><span>Medium</span></label>
          <label class="opt"><input type="checkbox" value="Large"><span>Large</span></label>
        </div>
      </div>

      <div class="fgroup">
        <label class="lbl" for="sex">Sex</label>
        <select class="input" id="sex">
          <option value="">Any</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
      </div>

      <div class="fgroup">
        <label class="lbl" for="district">District</label>
        <select class="input" id="district"><option value="">All of Cyprus</option></select>
      </div>

      <div class="fgroup">
        <label class="lbl" for="since">Found within</label>
        <select class="input" id="since">
          <option value="">Any time</option>
          <option value="3">Last 3 days</option>
          <option value="7">Last 7 days</option>
          <option value="30">Last 30 days</option>
        </select>
      </div>

      <div class="fgroup">
        <span class="lbl">Identification</span>
        <label class="check"><input type="checkbox" id="collar"> Wearing a collar</label>
        <label class="check"><input type="checkbox" id="chipped"> Microchipped</label>
      </div>

      <button type="button" class="btn btn-primary btn-block done" onclick="document.body.classList.remove('filters-open')">Show results</button>
    </form>

    <main>
      <div class="main-top">
        <span class="count" id="count" aria-live="polite"></span>
        <div style="display:flex;gap:8px;align-items:center">
          <button type="button" class="btn btn-ghost" id="save-search">Save search</button>
          <button type="button" class="btn btn-secondary" id="toggle-filters">Filters <span id="filter-count"></span></button>
          <label class="sortbox"><span>Sort</span>
            <select class="input" id="sort">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
              <option value="area">By area</option>
            </select>
          </label>
        </div>
      </div>
      <div class="active" id="active"></div>
      <div class="results" id="results"></div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.js"></script>
<script src="config.js?v=3"></script>
<script src="data.js?v=3"></script>
<script src="api.js?v=3"></script>
<script src="save-search.js?v=3"></script>
<script src="browse.js?v=3"></script>
</body>
</html>
