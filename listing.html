<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pet listing — Find My Pet Cyprus</title>
<script src="./ds-base.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root { --edge: clamp(16px, 4vw, 48px); }
body { margin: 0; }
.nav { padding-inline: var(--edge); position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--color-bg) 92%, transparent); backdrop-filter: blur(6px); }
.nav .links { display: flex; gap: var(--space-4); margin-right: auto; margin-left: var(--space-4); }
@media (max-width: 620px) { .nav .links { display: none; } }

.wrap { max-width: 1080px; margin: 0 auto; padding: var(--space-6) var(--edge) calc(4 * var(--space-6)); }
.back { font-size: 13px; color: color-mix(in srgb, var(--color-text) 65%, transparent); text-decoration: none; display: inline-block; margin-bottom: var(--space-4); }
.back:hover { color: var(--color-accent); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 380px); gap: calc(2 * var(--space-6)); }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

.photo-main { border-radius: calc(2 * var(--radius-lg)); overflow: hidden; aspect-ratio: 4/3; box-shadow: var(--shadow-md); }
.photo-main img { width: 100%; height: 100%; object-fit: cover; }

.head-row { display: flex; align-items: center; gap: var(--space-3); margin: var(--space-4) 0 6px; flex-wrap: wrap; }
.pet-name { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 34px; margin: 0; }
.meta-line { font-size: 14.5px; color: color-mix(in srgb, var(--color-text) 65%, transparent); margin: 0 0 var(--space-4); }
.desc { font-size: 15.5px; line-height: 1.7; max-width: 62ch; }

.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); margin: var(--space-4) 0; }
.fact { background: var(--color-surface); border-radius: var(--radius-md); padding: var(--space-3); }
.fact .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: color-mix(in srgb, var(--color-text) 60%, transparent); margin-bottom: 3px; }
.fact .v { font-family: var(--font-heading); font-size: 15px; }

#mini-map { width: 100%; height: 220px; border-radius: var(--radius-lg); overflow: hidden; margin-top: var(--space-3); }

.side-card { background: var(--color-surface); border-radius: calc(var(--radius-lg) * 1.15); padding: var(--space-4); position: sticky; top: 80px; box-shadow: var(--shadow-sm); }
.side-card h3 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 19px; margin: 0 0 6px; }
.side-card p { font-size: 13.5px; color: color-mix(in srgb, var(--color-text) 70%, transparent); margin: 0 0 var(--space-3); }
.reveal { display: flex; flex-direction: column; gap: 8px; }
.reveal .contact-line { display: none; font-size: 15px; padding: 10px 12px; background: var(--color-accent-100); border-radius: var(--radius-md); font-weight: 600; color: var(--color-accent-800); }
.reveal.on .contact-line { display: block; }
.reveal.on .btn-primary { display: none; }
.share-row { display: flex; gap: 8px; margin-top: var(--space-3); }
.share-row .btn { flex: 1; }
.thumbs { display: flex; gap: 8px; margin-top: 10px; }
.thumbs button { width: 72px; height: 72px; padding: 0; border: 2px solid transparent; border-radius: var(--radius-md); overflow: hidden; cursor: pointer; background: none; }
.thumbs button[aria-current="true"] { border-color: var(--color-accent); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.notice { padding: 12px 16px; border-radius: var(--radius-md); background: var(--color-accent-100); color: var(--color-accent-800); font-weight: 600; font-size: 14px; margin-bottom: 16px; }
.missing-box { padding: 60px 24px; text-align: center; border: 2px dashed var(--color-neutral-300); border-radius: var(--radius-lg); margin-top: 24px; }
.reveal .contact-line a { color: inherit; }
</style>
</head>
<body>
<nav class="nav">
  <span class="nav-brand">Find My Pet Cyprus</span>
  <span class="links">
    <a href="search.html">Search map</a>
    <a href="submit.html">Report a pet</a>
  </span>
</nav>

<div class="wrap" id="content">
  <a class="back" id="back" href="search.html">← Back to listings</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.js"></script>
<script src="config.js?v=3"></script>
<script src="data.js?v=3"></script>
<script src="api.js?v=3"></script>
<script>
(function(){
  var id = Number(new URLSearchParams(location.search).get('id'));
  var content = document.getElementById('content');
  function notFound(msg){
    content.insertAdjacentHTML('beforeend', '<div class="missing-box"><h1 class="pet-name" style="font-size:26px">Listing not available</h1><p class="desc">' + msg + '</p><p><a class="btn btn-primary" href="index.html">Back to the map</a></p></div>');
  }
  API.ready.then(function(){ return id ? API.getListing(id) : null; }).then(function(p){
    if (!p) return notFound('It may have been removed, marked as reunited, or is still waiting for review.');
    render(p);
  }).catch(function(){ notFound('Could not load this listing. Please check your connection and try again.'); });

  function render(p){
  var isAdopt = p.status === 'adoption';
  var unnamed = p.name === 'Unnamed';
  var title = unnamed ? p.color + ' ' + (p.exoticType || p.species).toLowerCase() : p.name;
  document.title = title + ' — Find My Pet Cyprus';
  var md = document.querySelector('meta[name="description"]'); if (md) md.setAttribute('content', (p.desc || '').slice(0, 155));
  document.getElementById('back').href = isAdopt ? 'adopt.html' : p.status === 'missing' ? 'missing.html' : 'found.html';

  var statusLabel = isAdopt ? 'For adoption' : p.status === 'missing' ? 'Missing' : 'Found';
  var tagClass = p.status === 'missing' ? 'tag-accent' : 'tag-accent-2';
  var photos = p.photos && p.photos.length ? p.photos : [p.photo];
  var notice = '';
  if (p.closed) notice = '<div class="notice">This listing has been closed by the person who posted it.</div>';
  else if (p.moderationStatus && p.moderationStatus !== 'approved') notice = '<div class="notice">Only you can see this. It is ' + ({ pending: 'waiting for review', changes: 'waiting for changes', rejected: 'not approved' }[p.moderationStatus] || p.moderationStatus) + '.</div>';
  var when = isAdopt ? 'Available from ' : p.status === 'missing' ? 'Missing since ' : 'Found ';

  content.insertAdjacentHTML('beforeend', notice +
    '<div class="layout">' +
      '<div>' +
        '<div class="photo-main"><img id="main-photo" src="' + photos[0] + '" alt="' + title + '"></div>' +
        (photos.length > 1 ? '<div class="thumbs">' + photos.map(function(u, i){ return '<button type="button" data-src="' + u + '" aria-current="' + (i === 0) + '" aria-label="Photo ' + (i + 1) + '"><img src="' + u + '" alt=""></button>'; }).join('') + '</div>' : '') +
        '<div class="head-row"><h1 class="pet-name">' + title + '</h1><span class="tag ' + tagClass + '">' + statusLabel + '</span></div>' +
        '<p class="meta-line">' + (p.exoticType || p.species) + ' · ' + p.area + ' · ' + when + new Date(p.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long' }) + (p.time ? ', around ' + p.time : '') + '</p>' +
        '<p class="desc">' + p.desc + '</p>' +
        '<div class="facts">' +
          '<div class="fact"><div class="k">Breed</div><div class="v">' + p.breed + '</div></div>' +
          '<div class="fact"><div class="k">Colour</div><div class="v">' + p.color + (p.markings ? ' · ' + p.markings : '') + '</div></div>' +
          '<div class="fact"><div class="k">' + (isAdopt ? 'Age' : 'Size · sex') + '</div><div class="v">' + (isAdopt ? (p.age || '—') + (p.ageText ? ' · ' + p.ageText : '') : p.size + ' · ' + (p.sex === 'Unknown' ? 'sex unknown' : p.sex)) + '</div></div>' +
        '</div>' +
        '<div id="mini-map"></div>' +
      '</div>' +
      '<div>' +
        '<div class="side-card">' +
          '<h3>' + (isAdopt ? 'Interested in ' + title + '?' : p.status === 'missing' ? 'Seen this pet?' : 'Is this your pet?') + '</h3>' +
          '<p>Contact details are shared only after you tap the button, which keeps them out of search engines and spam.</p>' +
          '<div class="reveal" id="reveal">' +
            '<button class="btn btn-primary btn-block" id="reveal-btn" type="button">Show contact details</button>' +
            '<div class="contact-line" id="contact-line"></div>' +
          '</div>' +
          '<div class="share-row"><a class="btn btn-secondary" href="index.html">Nearby listings</a><button class="btn btn-secondary" type="button" id="share-btn">Share</button></div>' +
        '</div>' +
      '</div>' +
    '</div>'
  );

  content.querySelectorAll('.thumbs button').forEach(function(b){
    b.addEventListener('click', function(){
      document.getElementById('main-photo').src = b.dataset.src;
      content.querySelectorAll('.thumbs button').forEach(function(x){ x.setAttribute('aria-current', x === b); });
    });
  });

  document.getElementById('reveal-btn').addEventListener('click', function(){
    var btn = this; btn.disabled = true; btn.textContent = 'Loading…';
    API.revealContact(p.id, p).then(function(c){
      var line = document.getElementById('contact-line');
      line.innerHTML = c ? c.name + ' · <a href="tel:' + c.phone.replace(/[^\d+]/g, '') + '">' + c.phone + '</a>' : 'Contact details are not available.';
      document.getElementById('reveal').classList.add('on');
    }).catch(function(){ btn.disabled = false; btn.textContent = 'Show contact details'; alert('Could not load contact details. Please try again.'); });
  });

  document.getElementById('share-btn').addEventListener('click', function(){
    var data = { title: document.title, url: location.href };
    if (navigator.share) navigator.share(data).catch(function(){});
    else if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ document.getElementById('share-btn').textContent = 'Link copied'; });
  });

  var map = L.map('mini-map', { zoomControl: false, dragging: true, scrollWheelZoom: false }).setView([p.lat, p.lng], 13);
  L.tileLayer(API.TILE_URL, API.TILE_OPTS).addTo(map);
  var color = p.status === 'missing' ? '#c67139' : '#7a8a5e';
  L.marker([p.lat, p.lng], { icon: L.divIcon({ className: '', html: '<div style="width:16px;height:16px;border-radius:50%;background:' + color + ';border:3px solid #f5ead8;box-shadow:0 1px 3px rgba(0,0,0,.3)"></div>', iconSize:[16,16], iconAnchor:[8,8] }) }).addTo(map);
  }
})();
</script>
</body>
</html>
