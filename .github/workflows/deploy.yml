# Builds the site (Greek pages, pet pages, district pages, sitemap) and publishes it to GitHub Pages.
# Runs on every push, every 30 minutes (so newly approved pets get their own page), and on demand.
name: Build and publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Remembers looked-up vet/shelter addresses so each one is only looked up once
      - uses: actions/cache@v4
        with:
          path: .cache
          key: geocode-${{ hashFiles('data/services.csv') }}-${{ github.run_id }}
          restore-keys: geocode-
      - name: Build site
        run: node build/build.mjs
      - name: Privacy clean-up (old listings, unused photos)
        if: ${{ env.HAS_SERVICE_KEY == 'true' }}
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node build/cleanup.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
