<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Page not found — Find My Pet Cyprus</title>
<script>
// Send links from the previous version of the site, and pets whose page is still being built, to the right place.
(function(){
  var p = location.pathname.replace(/\/+$/, '').toLowerCase();
  var el = /^\/el(\/|$)/.test(p); if (el) p = p.replace(/^\/el/, '') || '/';
  var pre = el ? '/el' : '';
  var m, to = null;
  if ((m = p.match(/^\/(?:listing|pet)\/(\d+)/))) to = pre + '/listing.html?id=' + m[1];
  else if ((m = p.match(/^\/area\/([a-z-]+)/))) to = pre + '/missing.html?district=' + m[1].charAt(0).toUpperCase() + m[1].slice(1);
  else if (p === '/search' || p === '/map') to = pre + '/index.html';
  else if (p === '/submit' || p === '/report') to = pre + '/submit.html';
  else if (p === '/account') to = pre + '/account.html';
  else if (p === '/admin' || p === '/moderation') to = '/moderation.html';
  else if (/^\/(missing|found|adopt|privacy|terms)$/.test(p)) to = pre + p + '.html';
  if (to) { location.replace(to + (to.indexOf('?') > -1 ? location.search.replace(/^\?/, '&') : location.search) + location.hash); return; }
  if (el) document.addEventListener('DOMContentLoaded', function(){
    document.documentElement.lang = 'el';
    document.querySelector('h1').textContent = 'Η σελίδα δεν βρέθηκε';
    document.querySelector('p').textContent = 'Η σελίδα δεν υπάρχει ή έχει μετακινηθεί.';
    var a = document.querySelector('a'); a.textContent = 'Στον χάρτη'; a.href = '/el/';
  });
})();
</script>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #fff; color: #201e1d; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 16px; text-align: center; }
  a { display: inline-block; margin-top: 12px; padding: 10px 20px; border-radius: 999px; background: #c67139; color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <div>
    <h1 style="font-size:28px;margin:0 0 8px">Page not found</h1>
    <p style="margin:0">This page doesn't exist or has moved.</p>
    <a href="/index.html">Go to the map</a>
  </div>
</body>
</html>
