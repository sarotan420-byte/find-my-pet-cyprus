<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Moderation queue — Find My Pet Cyprus</title>
<script src="./ds-base.js"></script>
<link rel="stylesheet" href="site.css?v=12" />
<script src="i18n.js?v=9"></script>
<style>
:root { --edge: clamp(16px, 3vw, 32px); --white: #fff; }
body { margin: 0; background: var(--white); text-wrap: pretty; }
a { color: var(--color-accent-700); }
a:hover { color: var(--color-accent-800); }
.nav { padding-inline: var(--edge); position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--color-neutral-200); }
.nav .mod { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--color-accent-700); margin-left: var(--space-3); margin-right: auto; }
.nav .actions { display: flex; align-items: center; gap: var(--space-3); }
.nav .actions a:not(.btn) { color: var(--color-text); text-decoration: none; }

.wrap { padding: var(--space-4) var(--edge) var(--space-6); }
.top { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); flex-wrap: wrap; margin-bottom: var(--space-4); }
.top h1 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 30px; margin: 0; }
.tabs { display: flex; background: var(--color-neutral-100); border-radius: 999px; padding: 4px; gap: 2px; flex-wrap: wrap; }
.tabs button { all: unset; cursor: pointer; padding: 8px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.tabs button[aria-selected="true"] { background: var(--white); box-shadow: var(--shadow-sm); }
.tabs button b { font-weight: 700; background: var(--color-neutral-200); border-radius: 999px; padding: 1px 8px; font-size: 12px; }
.tabs button[aria-selected="true"] b { background: var(--color-accent-100); color: var(--color-accent-800); }
.tabs button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

.layout { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: var(--space-4); align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

.queue { display: flex; flex-direction: column; gap: 6px; }
.qtools { display: flex; gap: 8px; margin-bottom: 6px; }
.qtools select { background: var(--white); }
.qitem { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 56px minmax(0,1fr); gap: 12px; padding: 10px; border-radius: var(--radius-lg); border: 1.5px solid var(--color-neutral-200); }
.qitem:hover { border-color: var(--color-accent-300); }
.qitem[aria-current="true"] { border-color: var(--color-text); background: var(--color-neutral-100); }
.qitem:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.qitem img { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; }
.qitem .noimg { width: 56px; height: 56px; border-radius: 12px; background: var(--color-neutral-100); display: flex; align-items: center; justify-content: center; font-size: 11px; color: color-mix(in srgb, var(--color-text) 55%, transparent); text-align: center; }
.qitem .l1 { display: flex; align-items: center; gap: 6px; }
.qitem .n { font-family: var(--font-heading); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qitem .m { font-size: 12px; color: color-mix(in srgb, var(--color-text) 62%, transparent); margin-top: 2px; }
.flags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.flag { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--color-accent-100); color: var(--color-accent-800); }
.flag.warn { background: #fde8e4; color: #8a2b1d; }
.empty { padding: var(--space-6) var(--space-4); text-align: center; border: 1.5px dashed var(--color-neutral-300); border-radius: var(--radius-lg); font-size: 14px; color: color-mix(in srgb, var(--color-text) 65%, transparent); }

.review { border: 1px solid var(--color-neutral-200); border-radius: calc(1.25 * var(--radius-lg)); overflow: hidden; position: sticky; top: 76px; }
.rv-head { padding: var(--space-4); display: flex; justify-content: space-between; gap: var(--space-3); align-items: start; border-bottom: 1px solid var(--color-neutral-200); flex-wrap: wrap; }
.rv-head h2 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 26px; margin: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rv-head .m { font-size: 13px; color: color-mix(in srgb, var(--color-text) 62%, transparent); margin-top: 4px; }
.rv-body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; }
@media (max-width: 1200px) { .rv-body { grid-template-columns: 1fr; } }
.rv-main { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }
.photos { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; }
.photos img, .photos .ph-empty { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: var(--radius-md); }
.photos .ph-empty { background: var(--color-neutral-100); display: flex; align-items: center; justify-content: center; font-size: 12px; color: color-mix(in srgb, var(--color-text) 55%, transparent); }
.desc { font-size: 15px; line-height: 1.6; margin: 0; padding: var(--space-3) var(--space-4); background: var(--color-neutral-100); border-radius: var(--radius-lg); }
.desc mark { background: #fde8e4; color: #8a2b1d; border-radius: 4px; padding: 0 3px; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 1px; background: var(--color-neutral-200); border: 1px solid var(--color-neutral-200); border-radius: var(--radius-lg); overflow: hidden; }
.fact { background: var(--white); padding: 10px 14px; }
.fact .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: color-mix(in srgb, var(--color-text) 55%, transparent); }
.fact .v { font-size: 14px; margin-top: 2px; }
.lbl { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 62%, transparent); margin-bottom: 8px; display: block; }

.rv-side { border-left: 1px solid var(--color-neutral-200); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); background: color-mix(in srgb, var(--color-surface) 25%, var(--white)); }
@media (max-width: 1200px) { .rv-side { border-left: none; border-top: 1px solid var(--color-neutral-200); } }
.checks { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.checks li { display: flex; gap: 8px; font-size: 13.5px; line-height: 1.4; align-items: start; }
.checks svg { flex: none; margin-top: 1px; }
.checks .ok { color: var(--color-accent-2-700); }
.checks .bad { color: #a8361f; }
.checks .meh { color: var(--color-accent-700); }
.dupe { font-size: 13px; padding: 10px 12px; border-radius: var(--radius-md); background: var(--white); border: 1px solid var(--color-neutral-200); display: flex; gap: 10px; align-items: center; }
.dupe img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
.input { background: var(--white); border-color: var(--color-neutral-300); }
textarea.input { height: auto; min-height: 84px; border-radius: var(--radius-md); padding: 10px 14px; line-height: 1.5; resize: vertical; width: 100%; box-sizing: border-box; font: inherit; font-size: 14px; }
.acts { display: flex; flex-direction: column; gap: 8px; }
.acts .btn { min-height: 44px; justify-content: center; }
.btn-danger { background: var(--white); color: #8a2b1d; border: 1.5px solid #e9b9ae; }
.btn-danger:hover { background: #fde8e4; }
.kbd { font-size: 12px; color: color-mix(in srgb, var(--color-text) 55%, transparent); text-align: center; }
.kbd kbd { font-family: inherit; background: var(--white); border: 1px solid var(--color-neutral-300); border-radius: 5px; padding: 0 5px; font-size: 11px; }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--color-text); color: var(--white); padding: 12px 18px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s, transform .2s; display: flex; gap: 14px; align-items: center; z-index: 200; }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast button { all: unset; cursor: pointer; font-weight: 700; text-decoration: underline; }
</style>
</head>
<body>
<nav class="nav">
  <a class="nav-brand" href="index.html" style="text-decoration:none;color:inherit">Find My Pet Cyprus</a>
  <span class="mod">Moderation</span>
  <span class="actions">
    <span style="font-size:13px">Signed in as moderator</span>
    <a href="account.html" class="btn btn-secondary">Account</a>
  </span>
</nav>

<div class="wrap">
  <div class="top">
    <h1>Moderation queue</h1>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>

  <div class="layout">
    <div>
      <div class="qtools">
        <select class="input" id="ftype" aria-label="Filter by type">
          <option value="">All types</option>
          <option value="missing">Missing</option>
          <option value="found">Found</option>
          <option value="adoption">For adoption</option>
        </select>
        <select class="input" id="fsort" aria-label="Sort">
          <option value="old">Oldest first</option>
          <option value="flags">Most flags first</option>
        </select>
      </div>
      <div class="queue" id="queue" role="list"></div>
    </div>
    <section class="review" id="review" aria-live="polite"></section>
  </div>

</div>

<div class="toast" id="toast" role="status"><span id="toast-msg"></span><button type="button" id="undo">Undo</button></div>

<script src="vendor/supabase.js"></script>
<script src="config.js?v=8"></script>
<script src="data.js?v=8"></script>
<script src="api.js?v=10"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var NOW = API.live ? new Date() : new Date('2026-10-09T10:00:00');
  // Demo submissions. In production: GET /api/moderation?status=pending
  var ITEMS = [
    { id: 'S-2041', state: 'pending', status: 'missing', species: 'Dog', name: 'Coco', breed: 'Cocker spaniel', size: 'Medium', sex: 'Female', colours: ['Golden'], color: 'Golden', collar: true, chipped: true, area: 'Limassol — Agios Athanasios', district: 'Limassol', postcode: '4102', date: '2026-10-08', submitted: '2026-10-09T06:12:00', photos: 3, desc: 'Ran off during a walk near the stadium. Pink collar. Friendly but may be frightened.', contact: 'Despina · 99 456 210', accountAge: '2 years', priorListings: 1 },
    { id: 'S-2042', state: 'pending', status: 'found', species: 'Cat', name: '', breed: 'Domestic shorthair', size: 'Small', sex: 'Unknown', colours: ['Grey', 'Tabby'], color: 'Grey tabby', collar: false, chipped: false, area: 'Nicosia — Strovolos', district: 'Nicosia', postcode: '2018', date: '2026-10-08', submitted: '2026-10-09T07:40:00', photos: 2, desc: 'Grey tabby hanging around our building for two days, friendly, no collar.', contact: 'Giorgos · 97 112 008', accountAge: 'New today', priorListings: 0, dupeOf: 2 },
    { id: 'S-2043', state: 'pending', status: 'adoption', species: 'Dog', name: 'Pluto', breed: 'Husky cross', size: 'Large', sex: 'Male', colours: ['Black', 'White'], color: 'Black & white', collar: true, chipped: true, area: 'Larnaca — Dromolaxia', district: 'Larnaca', postcode: '7020', date: '2026-10-12', submitted: '2026-10-09T08:05:00', photos: 3, age: 'Adult', lister: 'Owner rehoming', fee: '400', desc: 'Moving abroad and cannot take him. Pure husky, papers available. Price negotiable, message me on WhatsApp.', contact: 'Andreas · 96 300 441', accountAge: '3 days', priorListings: 4, sale: true },
    { id: 'S-2044', state: 'pending', status: 'missing', species: 'Other', exoticType: 'Bird', name: 'Rio', breed: 'African grey parrot', size: 'Small', sex: 'Male', colours: [], color: 'Grey with red tail', collar: false, chipped: true, area: 'Paphos — Tala', district: 'Paphos', postcode: '', date: '2026-10-07', submitted: '2026-10-09T08:31:00', photos: 0, desc: 'Escaped from an open window yesterday evening. Talks, says his name and whistles. Ringed on left leg.', contact: 'Helen · 99 870 552', accountAge: '1 year', priorListings: 0 },
    { id: 'S-2045', state: 'pending', status: 'found', species: 'Dog', name: '', breed: 'Mixed breed', size: 'Small', sex: 'Male', colours: ['Brown'], color: 'Brown', collar: false, chipped: false, area: 'Famagusta — Sotira', district: 'Famagusta', postcode: '5390', date: '2026-10-09', submitted: '2026-10-09T09:20:00', photos: 1, desc: 'Small brown puppy found by the road this morning, maybe 3 months. At our house for now, call 99 001 223.', contact: 'Maria · 99 001 223', accountAge: '6 months', priorListings: 2, phoneInDesc: true }
  ];
  var TABS = [['pending', 'Pending'], ['changes', 'Changes requested'], ['approved', 'Approved'], ['rejected', 'Rejected']];
  var LABEL = { missing: 'Missing', found: 'Found', adoption: 'For adoption' };
  var TAG = { missing: 'tag-accent', found: 'tag-accent-2', adoption: 'tag-accent-2' };
  var tab = 'pending', sel = null, last = null;

  function ago(t){ var m = Math.max(0, Math.round((NOW - new Date(t)) / 60000)); return m < 60 ? m + ' min ago' : m < 2880 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' days ago'; }
  function title(it){ return it.name || (it.color + ' ' + (it.species === 'Other' ? it.exoticType : it.species).toLowerCase()); }
  function checks(it){
    var c = [];
    c.push(it.photos ? ['ok', it.photos + ' photo' + (it.photos > 1 ? 's' : '') + ' attached'] : ['bad', 'No photos. Ask the poster to add one']);
    if (it.dupeOf) c.push(['bad', 'Possible duplicate of a live listing']);
    if (it.sale) c.push(['bad', 'Looks like a sale ("price", "papers"). Adoption fees over €150 need review']);
    if (it.phoneInDesc) c.push(['meh', 'Phone number in the description will be public. Remove it']);
    c.push(it.accountAge === 'New today' || /day/.test(it.accountAge) ? ['meh', 'New account (' + it.accountAge + ')'] : ['ok', 'Account age: ' + it.accountAge]);
    if (it.priorListings > 3) c.push(['meh', it.priorListings + ' listings in the last 30 days']);
    var PC = { '1': 'Nicosia', '2': 'Nicosia', '3': 'Limassol', '4': 'Limassol', '5': 'Famagusta', '6': 'Larnaca', '7': 'Larnaca', '8': 'Paphos', '9': 'Kyrenia' };
    c.push(!it.postcode ? ['meh', 'No postcode. Area name only'] : PC[it.postcode[0]] === it.district ? ['ok', 'Postcode ' + it.postcode + ' matches ' + it.district] : ['meh', 'Postcode ' + it.postcode + ' does not look like ' + it.district]);
    c.push(it.status === 'missing' || it.status === 'found' ? (new Date(it.date) <= NOW ? ['ok', 'Date is valid'] : ['bad', 'Date is in the future']) : ['ok', 'Available from ' + it.date]);
    return c;
  }
  function flags(it){ return checks(it).filter(function(c){ return c[0] !== 'ok'; }); }
  function icon(k){
    if (k === 'ok') return '<svg class="ok" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
    if (k === 'bad') return '<svg class="bad" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
    return '<svg class="meh" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"><path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>';
  }

  function visible(){
    var t = $('ftype').value;
    var list = ITEMS.filter(function(i){ return i.state === tab && (!t || i.status === t); });
    return list.sort(function(a, b){ return $('fsort').value === 'flags' ? flags(b).length - flags(a).length : new Date(a.submitted) - new Date(b.submitted); });
  }

  function renderTabs(){
    $('tabs').innerHTML = TABS.map(function(t){
      var n = ITEMS.filter(function(i){ return i.state === t[0]; }).length;
      return '<button role="tab" type="button" data-t="' + t[0] + '" aria-selected="' + (tab === t[0]) + '">' + t[1] + ' <b>' + n + '</b></button>';
    }).join('');
    $('tabs').querySelectorAll('button').forEach(function(b){ b.onclick = function(){ tab = b.dataset.t; sel = null; render(); }; });
  }

  function renderQueue(list){
    $('queue').innerHTML = list.length ? list.map(function(it){
      var f = flags(it);
      return '<button type="button" role="listitem" class="qitem" data-id="' + it.id + '" aria-current="' + (sel === it.id) + '">' +
        (it.photos ? '<img src="' + ((it.photoUrls && it.photoUrls[0]) || 'assets/photo.jpg') + '" alt="">' : '<span class="noimg">No photo</span>') +
        '<span style="min-width:0"><span class="l1"><span class="n">' + title(it) + '</span><span class="tag ' + TAG[it.status] + '">' + LABEL[it.status] + '</span></span>' +
        '<span class="m" style="display:block">' + it.area + ' · ' + ago(it.submitted) + '</span>' +
        (f.length ? '<span class="flags">' + f.map(function(x){ return '<span class="flag' + (x[0] === 'bad' ? ' warn' : '') + '">' + x[1].split(/[.(]/)[0].trim() + '</span>'; }).join('') + '</span>' : '') +
        '</span></button>';
    }).join('') : '<div class="empty">Nothing here. ' + (tab === 'pending' ? 'The queue is clear.' : '') + '</div>';
    $('queue').querySelectorAll('.qitem').forEach(function(b){ b.onclick = function(){ sel = b.dataset.id; render(); }; });
  }

  function renderReview(it){
    if (!it) { $('review').innerHTML = '<div class="empty" style="border:none;padding:80px 24px">Select a submission to review it.</div>'; return; }
    var kind = it.species === 'Other' ? 'Other / exotic · ' + it.exoticType : it.species;
    var facts = [['Animal', kind], ['Breed', it.breed], ['Colour', it.colours.length ? it.colours.join(', ') : it.color], ['Size · sex', it.size + ' · ' + it.sex],
      ['ID', [it.collar ? 'Collar' : '', it.chipped ? (it.species === 'Other' ? 'Ringed / chipped' : 'Microchipped') : ''].filter(Boolean).join(', ') || 'None'],
      ['Location', it.area + (it.postcode ? ', ' + it.postcode : '')], [it.status === 'adoption' ? 'Available from' : 'Date', it.date], ['Contact', it.contact]];
    if (it.status === 'adoption') facts.push(['Age', it.age], ['Listed by', it.lister], ['Fee', it.fee ? '€' + it.fee : 'Free']);
    var desc = it.desc.replace(/(price|negotiable|papers|whatsapp|\d{2} \d{3} \d{3})/gi, '<mark>$1</mark>');
    var dupe = it.dupeOf ? window.PETS.find(function(p){ return p.id === it.dupeOf; }) : null;
    var pending = it.state === 'pending' || it.state === 'changes';
    var ph = []; for (var i = 0; i < 3; i++) ph.push(i < it.photos ? '<a href="' + ((it.photoUrls && it.photoUrls[i]) || 'assets/photo.jpg') + '" target="_blank"><img src="' + ((it.photoUrls && it.photoUrls[i]) || 'assets/photo.jpg') + '" alt="Submitted photo ' + (i+1) + '"></a>' : '<div class="ph-empty">' + (i === 0 ? 'No photo' : '') + '</div>');

    $('review').innerHTML =
      '<div class="rv-head"><div><h2>' + title(it) + ' <span class="tag ' + TAG[it.status] + '">' + LABEL[it.status] + '</span></h2>' +
      '<div class="m">' + it.id + ' · submitted ' + ago(it.submitted) + ' · ' + it.priorListings + ' previous listing' + (it.priorListings === 1 ? '' : 's') + '</div></div>' +
      (it.state !== 'pending' ? '<span class="tag tag-neutral">' + TABS.find(function(t){ return t[0] === it.state; })[1] + '</span>' : '') + '</div>' +
      '<div class="rv-body"><div class="rv-main">' +
        '<div class="photos">' + ph.join('') + '</div>' +
        '<div><span class="lbl">Description</span><p class="desc">' + desc + '</p></div>' +
        '<div><span class="lbl">Details</span><div class="facts">' + facts.map(function(f){ return '<div class="fact"><div class="k">' + f[0] + '</div><div class="v">' + f[1] + '</div></div>'; }).join('') + '</div></div>' +
      '</div><div class="rv-side">' +
        '<div><span class="lbl">Automatic checks</span><ul class="checks">' + checks(it).map(function(c){ return '<li>' + icon(c[0]) + '<span>' + c[1] + '</span></li>'; }).join('') + '</ul></div>' +
        (dupe ? '<div><span class="lbl">Possible match</span><a class="dupe" href="listing.html?id=' + dupe.id + '" target="_blank"><img src="' + dupe.photo + '" alt=""><span><b>' + (dupe.name === 'Unnamed' ? dupe.color : dupe.name) + '</b><br>' + dupe.area + ' · live</span></a></div>' : '') +
        (pending ?
          '<div><label class="lbl" for="note">Note to poster</label><textarea class="input" id="note" placeholder="Required for “Request changes” and “Reject”. Shown to the poster in their account."></textarea></div>' +
          '<div><label class="lbl" for="reason">Reject reason</label><select class="input" id="reason"><option>Duplicate listing</option><option>Selling animals</option><option>Not a pet / spam</option><option>Offensive content</option><option>Other</option></select></div>' +
          '<div class="acts"><button class="btn btn-primary" type="button" data-act="approved">Approve and publish</button><button class="btn btn-secondary" type="button" data-act="changes">Request changes</button><button class="btn btn-danger" type="button" data-act="rejected">Reject</button></div>' +
          '<div class="kbd"><kbd>J</kbd>/<kbd>K</kbd> next / previous · <kbd>A</kbd> approve</div>'
        : '<button class="btn btn-secondary" type="button" data-act="pending">Move back to pending</button>') +
      '</div></div>';

    $('review').querySelectorAll('[data-act]').forEach(function(b){ b.onclick = function(){ act(it, b.dataset.act); }; });
  }

  function act(it, to){
    var note = $('note') ? $('note').value.trim() : '';
    if ((to === 'changes' || to === 'rejected') && !note) { $('note').focus(); $('note').setAttribute('placeholder', 'Add a short note so the poster knows what to fix.'); $('note').style.borderColor = '#a8361f'; return; }
    var list = visible(), idx = list.indexOf(it);
    last = { it: it, from: it.state };
    var from = it.state;
    it.state = to;
    if (API.live) API.moderate(it.id, to, note, to === 'rejected' && $('reason') ? $('reason').value : null).catch(function(e){
      it.state = from; render(); alert('Could not save: ' + e.message);
    });
    var rest = visible();
    sel = rest.length ? (rest[Math.min(idx, rest.length - 1)] || rest[0]).id : null;
    toast({ approved: 'Published: ', changes: 'Changes requested: ', rejected: 'Rejected: ', pending: 'Moved back: ' }[to] + title(it));
    render();
  }

  var tt;
  function toast(msg){ $('toast-msg').textContent = msg; $('toast').classList.add('on'); clearTimeout(tt); tt = setTimeout(function(){ $('toast').classList.remove('on'); }, 4000); }
  $('undo').onclick = function(){ if (last) { if (API.live) API.moderate(last.it.id, last.from).catch(function(e){ alert('Could not undo: ' + e.message); }); last.it.state = last.from; tab = last.from; sel = last.it.id; last = null; $('toast').classList.remove('on'); render(); } };

  function render(){
    renderTabs();
    var list = visible();
    if (!sel || !list.some(function(i){ return i.id === sel; })) sel = list.length ? list[0].id : null;
    renderQueue(list);
    renderReview(ITEMS.find(function(i){ return i.id === sel; }));
  }

  document.addEventListener('keydown', function(e){
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    var list = visible(), i = list.findIndex(function(x){ return x.id === sel; });
    if (e.key === 'j' && i < list.length - 1) { sel = list[i + 1].id; render(); }
    if (e.key === 'k' && i > 0) { sel = list[i - 1].id; render(); }
    if (e.key === 'a' && list[i] && list[i].state !== 'approved') act(list[i], 'approved');
  });
  $('ftype').onchange = render; $('fsort').onchange = render;
  function toItem(p){
    var raw = p.rawDesc || '';
    var age = (NOW - new Date(p.ownerCreatedAt || NOW)) / 864e5;
    var dupe = (window.PETS || []).concat(window.ADOPT || []).find(function(x){
      return x.id !== p.id && x.status === p.status && x.species === p.species && x.district === p.district &&
        (!p.colours.length || p.colours.some(function(c){ return x.colours.indexOf(c) > -1; })) &&
        Math.abs(new Date(x.date) - new Date(p.date)) < 10 * 864e5;
    });
    return {
      id: p.id, state: p.closed ? 'approved' : p.moderationStatus, status: p.status, species: p.species, exoticType: p.exoticType,
      name: p.name === 'Unnamed' ? '' : p.name, breed: p.breed, size: p.size, sex: p.sex, colours: p.colours, color: p.color,
      collar: p.collar, chipped: p.chipped, area: p.area, district: p.district, postcode: p.postcode, date: p.date,
      submitted: p.createdAt, photos: p.photos.length, photoUrls: p.photos, desc: p.desc, contact: p.contact,
      accountAge: p.ownerAnonymous ? 'Guest, ' + (age < 1 ? 'new today' : Math.round(age) + ' days') : age < 1 ? 'New today' : Math.round(age) + ' days',
      priorListings: Math.max(0, p.ownerRecent - 1), dupeOf: dupe ? dupe.id : null,
      sale: /(price|negotiable|papers|pedigree|for sale|€|euro)/i.test(raw), phoneInDesc: /(\+?357)?\s?\d{2}\s?\d{3}\s?\d{3}/.test(raw),
      age: p.age, lister: p.lister, fee: ''
    };
  }
  function gate(msg){ $('review').innerHTML = '<div class="empty" style="border:none;padding:80px 24px">' + msg + '</div>'; $('queue').innerHTML = ''; }

  if (!API.live) { render(); return; }
  gate('Loading…');
  API.ready.then(API.getUser).then(function(u){
    if (!u || u.is_anonymous) return gate('Please <a href="account.html">sign in</a> with a moderator account.');
    return API.isModerator().then(function(ok){
      if (!ok) return gate('Your account is not a moderator.');
      return API.moderationQueue().then(function(rows){ ITEMS = rows.map(toItem); render(); });
    });
  }).catch(function(e){ gate('Could not load the queue: ' + API.esc(e.message)); });
})();
</script>
</body>
</html>
